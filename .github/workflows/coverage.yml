name: coverage

# `coverage` context the org ruleset requires. fc#2279: the old estate coverage.yml chose its command
# with `npm run --silent | grep`, which prints nothing on npm 10, so it fell through to an echo and
# passed without running tests. This repo has no root npm/go manifest, so the estate template does
# not apply; this job runs the SAME command ci runs, directly, with no fallthrough branch. Every
# green run prints one line `coverage-standard: EXECUTED <cmd>`; classify a run by that line.
# Does NOT use actions/upload-code-coverage (paid Code Quality).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev libwebsockets-dev libcurl4-openssl-dev libsqlite3-dev pkg-config

      - name: Run tests
        run: |
          set -euo pipefail
          echo "coverage-standard: EXECUTED make check"
          make check
